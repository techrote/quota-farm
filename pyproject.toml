[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-farm"
version = "0.1.0"
description = "Tool-free model worker farm with local evidence and conservative budget accounting"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
quota-farm = "quota_farm.cli:main"

[tool.setuptools.packages.find]
include = ["quota_farm*"]
